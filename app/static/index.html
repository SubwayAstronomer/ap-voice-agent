<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Autopilot - invoice to decision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=9">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">AP</div>
      <div><b>AP Autopilot</b><span>Invoice to decision</span></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/new" data-r="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New run</a>
      <a href="#/run" data-r="run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h6"/></svg>Live run</a>
      <a href="#/dashboard" data-r="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Dashboard</a>
      <a href="#/queue" data-r="queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 16.5v.5M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Exception queue<span class="count" id="qcount" hidden></span></a>
      <a href="#/quality" data-r="quality"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6z"/></svg>Accuracy</a>
      <a href="#/rules" data-r="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Rules</a>
      <a href="#/reference" data-r="reference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>Reference data</a>
    </nav>
    <div class="foot">Extraction mode<span class="mode" id="mode">...</span>
      <button class="linkbtn" id="llmTest" hidden>Test AI connection</button>
      <span class="llm-result" id="llmResult"></span></div>
  </aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js?v=9"></script>
</body>
</html>
